services:
  # Production: serves AgriVision Next.js standalone runtime
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: agrivision:latest
    container_name: agrivision-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Dev: `next dev` + Playwright Chromium for local development and tests
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agrivision:dev
    container_name: agrivision-dev
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    volumes:
      - .:/app
